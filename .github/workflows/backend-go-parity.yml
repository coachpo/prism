name: Backend Go Parity

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/openapi.json"
      - "start.sh"
      - "release.sh"
      - "VERSION"
      - ".github/workflows/backend-go-parity.yml"
      - ".github/workflows/docker-images.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/openapi.json"
      - "start.sh"
      - "release.sh"
      - "VERSION"
      - ".github/workflows/backend-go-parity.yml"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run backend startup and bundle contract checks
        working-directory: backend
        run: |
          go test ./cmd/prism-backend
          go test ./tests/contract -run 'Test(HealthVersionSurface|ConfigBundleV1Export|ConfigBundleDownloadHeaders|VendorCatalogV1Export|VendorCatalogDownloadHeaders|ConfigBundlePreviewResponses|NormativeDocsParity|OpenAPIDiff|OpenAPIRuntimeExclusion|FrontendDocParity|BackendDocParity|BundleVersionParity)$'
          go test ./...

      - name: Run launcher smoke checks
        run: |
          set -euo pipefail
          cleanup_start() {
            if [[ -n "${START_PID:-}" ]]; then
              kill "$START_PID" 2>/dev/null || true
              wait "$START_PID" 2>/dev/null || true
            fi
            START_PID=""
          }

          trap 'cleanup_start' EXIT

          ./start.sh headless >/tmp/prism-start-ci.log 2>&1 &
          START_PID=$!
          sleep 10
          curl -fsS http://localhost:18000/health >/dev/null
          curl -fsS http://localhost:18000/openapi.json >/dev/null
          cleanup_start

          WEBAUTHN_ORIGIN=http://override.invalid ./start.sh full >/tmp/prism-full-ci.log 2>&1 &
          START_PID=$!
          sleep 20
          curl -fsS http://localhost:15173/health >/dev/null
          curl -fsSI -X OPTIONS http://localhost:18000/api/profiles -H 'Origin: http://localhost:15173' -H 'Access-Control-Request-Method: GET' | grep -qi 'access-control-allow-origin: http://localhost:15173'
          FRONTEND_PID=$(lsof -iTCP:15173 -sTCP:LISTEN -t)
          BACKEND_PID=$(lsof -iTCP:18000 -sTCP:LISTEN -t)
          ps eww -p "$FRONTEND_PID" | grep -q 'VITE_API_BASE=http://localhost:18000'
          ps eww -p "$BACKEND_PID" | grep -q 'WEBAUTHN_ORIGIN=http://override.invalid'
          cleanup_start

      - name: Run frontend export filename Playwright test
        run: pnpm --dir frontend exec playwright test tests/e2e/settings-config-export.spec.ts

      - name: Run frontend quality checks
        run: |
          pnpm --dir frontend exec eslint .
          pnpm --dir frontend exec tsc --noEmit

      - name: Run release dry-run parity check
        run: ./release.sh --dry-run patch
