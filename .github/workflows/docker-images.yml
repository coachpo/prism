name: Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      service:
        description: Select service to build
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release publish mid-push; tag refs are unique per release anyway.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.event.repository.name }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.event.repository.name }}-frontend
  BUILD_PLATFORM: linux/arm64

jobs:
  verify-ci:
    # release.sh pushes the release commit and the tag together, so CI for that
    # commit may still be running when this workflow starts. Publishing waits for
    # a green CI conclusion on the tagged commit and refuses to ship otherwise.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            conclusion=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --json status,conclusion \
              --jq 'first | if .status == "completed" then .conclusion else "pending" end' 2>/dev/null || echo "none")
            case "$conclusion" in
              success)
                echo "CI is green for $GITHUB_SHA"
                exit 0
                ;;
              pending|none)
                echo "CI for $GITHUB_SHA not finished yet (state: $conclusion), attempt $attempt/60"
                sleep 30
                ;;
              *)
                echo "CI concluded '$conclusion' for $GITHUB_SHA — refusing to publish images"
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for CI on $GITHUB_SHA"
          exit 1

  build-and-push:
    needs: verify-ci
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.verify-ci.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.service != 'all' && format('["{0}"]', inputs.service) || '["backend","frontend"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service == 'backend' && env.IMAGE_NAME_BACKEND || env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve frontend build metadata from monorepo commit
        id: frontend_build_metadata
        if: matrix.service == 'frontend'
        run: |
          echo "git_revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "git_run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.service == 'backend' && '.' || format('./{0}', matrix.service) }}
          file: ${{ matrix.service == 'backend' && './backend/Dockerfile' || format('./{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('VITE_GIT_RUN_NUMBER={0}', steps.frontend_build_metadata.outputs.git_run_number) || '' }}
            ${{ matrix.service == 'frontend' && format('VITE_GIT_REVISION={0}', steps.frontend_build_metadata.outputs.git_revision) || '' }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
          cache-to: |
            type=gha,scope=${{ matrix.service }},mode=max
          platforms: ${{ env.BUILD_PLATFORM }}
          # Kept off on purpose: single-manifest images keep cleanup.yml's
          # delete-only-untagged pruning safe. Enabling provenance/sbom creates
          # untagged child manifests that the nightly cleanup would destroy.
          provenance: false
          sbom: false
