name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend unit tests
        working-directory: backend
        run: go test ./internal/... ./cmd/...

      - name: Run backend regression suites
        working-directory: backend
        run: go test ./internal/platform/lifecycle ./tests/contract ./tests/integration ./tests/runtime ./tests/priority/...

      - name: Build backend
        working-directory: backend
        run: go build ./cmd/prism-backend

  frontend-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm exec vitest run

      - name: Run frontend seam tests
        working-directory: frontend
        run: pnpm run test:lib

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Install Playwright chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run frontend journey specs
        working-directory: frontend
        run: pnpm run test:e2e

  dependency-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run backend vulnerability scanner
        working-directory: backend
        run: govulncheck ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend production dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high

  container-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Resolve short git revision
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build single-image bundle for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: prism-single:ci
          load: true
          build-args: |
            VITE_API_BASE=
            VITE_GIT_RUN_NUMBER=${{ github.run_number }}
            VITE_GIT_REVISION=${{ steps.rev.outputs.short }}
          cache-from: type=gha,scope=ci-single
          cache-to: type=gha,scope=ci-single,mode=max

      - name: Smoke test single-image bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          export PRISM_IMAGE=prism-single:ci
          export PRISM_PUBLIC_PORT=18080
          compose=(docker compose -p prism-single-ci -f docker-compose.yml)
          cleanup() {
            "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${compose[@]}" up -d --no-build
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PRISM_PUBLIC_PORT}/health" >/tmp/prism-single-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            "${compose[@]}" ps
            "${compose[@]}" logs prism
            exit 1
          fi

          grep -q '"status":"ok"' /tmp/prism-single-health.json
          curl -fsS "http://127.0.0.1:${PRISM_PUBLIC_PORT}/" | tee /tmp/prism-single-index.html | grep -qi '<!doctype html>'
          grep -Eq '(/assets/|/src/)' /tmp/prism-single-index.html

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.71.0
          cache: true

      - name: Scan local container images with Trivy (non-blocking evidence)
        shell: bash
        run: |
          mkdir -p trivy-reports
          single_status=0

          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format sarif --output trivy-reports/prism-single.sarif prism-single:ci || single_status=$?
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output trivy-reports/prism-single.txt prism-single:ci || single_status=$?

          {
            echo "Prism container scanner policy"
            echo "Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Scanned local image only: prism-single:ci"
            echo "Severity: HIGH,CRITICAL"
            echo "Ignore unfixed: true"
            echo "Exit code mode: 0 for vulnerability findings"
            echo "Blocking: false"
            echo "Rationale: Trivy advisory DB and network drift can make image-vulnerability gating unstable in this wave."
            echo "Single-image Trivy command status: ${single_status}"
          } > trivy-reports/status.txt

          {
            echo "### Container vulnerability scan evidence"
            echo ""
            echo "Trivy scans are non-blocking in this wave. Reports are uploaded as artifacts and statuses are recorded below."
            echo ""
            echo "- Single image: \`prism-single:ci\`, status \`${single_status}\`"
            echo "- Rationale: advisory DB and network drift can make container scanner gating unstable."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Upload Trivy scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-local-image-reports
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 14
