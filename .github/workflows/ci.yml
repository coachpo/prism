name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend regression suites
        working-directory: backend
        run: go test ./internal/platform/lifecycle ./tests/contract ./tests/integration ./tests/runtime ./tests/priority/...

      - name: Build backend
        working-directory: backend
        run: go build ./cmd/prism-backend

  frontend-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm exec vitest run

      - name: Run frontend seam tests
        working-directory: frontend
        run: pnpm run test:lib

      - name: Run frontend server health tests
        working-directory: frontend
        run: pnpm run test:server

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Install Playwright chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run frontend journey specs
        working-directory: frontend
        run: pnpm run test:e2e

  dependency-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run backend vulnerability scanner
        working-directory: backend
        run: govulncheck ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.30.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend production dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high

  container-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Resolve short git revision
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend container image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          tags: prism-backend:ci
          load: true
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,scope=ci-backend,mode=max

      - name: Build frontend container image for scan
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: prism-frontend:ci
          load: true
          build-args: |
            VITE_GIT_RUN_NUMBER=${{ github.run_number }}
            VITE_GIT_REVISION=${{ steps.rev.outputs.short }}
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,scope=ci-frontend,mode=max

      - name: Build single-image bundle for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: prism-single:ci
          load: true
          build-args: |
            VITE_GIT_RUN_NUMBER=${{ github.run_number }}
            VITE_GIT_REVISION=${{ steps.rev.outputs.short }}
          cache-from: type=gha,scope=ci-single
          cache-to: type=gha,scope=ci-single,mode=max

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.71.0
          cache: true

      - name: Scan local container images with Trivy (non-blocking evidence)
        shell: bash
        run: |
          mkdir -p trivy-reports
          backend_status=0
          frontend_status=0
          single_status=0

          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format sarif --output trivy-reports/prism-backend.sarif prism-backend:ci || backend_status=$?
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output trivy-reports/prism-backend.txt prism-backend:ci || backend_status=$?
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format sarif --output trivy-reports/prism-frontend.sarif prism-frontend:ci || frontend_status=$?
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output trivy-reports/prism-frontend.txt prism-frontend:ci || frontend_status=$?
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format sarif --output trivy-reports/prism-single.sarif prism-single:ci || single_status=$?
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output trivy-reports/prism-single.txt prism-single:ci || single_status=$?

          {
            echo "Prism container scanner policy"
            echo "Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Scanned local images only: prism-backend:ci, prism-frontend:ci, prism-single:ci"
            echo "Severity: HIGH,CRITICAL"
            echo "Ignore unfixed: true"
            echo "Exit code mode: 0 for vulnerability findings"
            echo "Blocking: false"
            echo "Rationale: Trivy advisory DB and network drift can make image-vulnerability gating unstable in this wave."
            echo "Backend Trivy command status: ${backend_status}"
            echo "Frontend Trivy command status: ${frontend_status}"
            echo "Single-image Trivy command status: ${single_status}"
          } > trivy-reports/status.txt

          {
            echo "### Container vulnerability scan evidence"
            echo ""
            echo "Trivy scans are non-blocking in this wave. Reports are uploaded as artifacts and statuses are recorded below."
            echo ""
            echo "- Backend image: \`prism-backend:ci\`, status \`${backend_status}\`"
            echo "- Frontend image: \`prism-frontend:ci\`, status \`${frontend_status}\`"
            echo "- Single image: \`prism-single:ci\`, status \`${single_status}\`"
            echo "- Rationale: advisory DB and network drift can make container scanner gating unstable."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Upload Trivy scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-local-image-reports
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 14
