# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Prism"

[setup]
script = '''
set -eu

for command_name in go node npm docker; do
    if ! command -v "$command_name" >/dev/null 2>&1; then
        echo "Missing required command: $command_name" >&2
        exit 1
    fi
done

docker compose version >/dev/null

node_major="$(node -p 'Number(process.versions.node.split(".")[0])')"
if [ "$node_major" -lt 24 ]; then
    echo "Prism requires Node.js 24 or newer" >&2
    exit 1
fi

# Managed worktrees start detached, so branch-derived Compose names are not
# unique. Keep each worktree's database volume isolated from other worktrees.
worktree_key="$(
    basename "$(git rev-parse --absolute-git-dir)" |
        tr '[:upper:]' '[:lower:]' |
        tr -cs 'a-z0-9' '-' |
        cut -c1-40
)"
worktree_key="${worktree_key#-}"
worktree_key="${worktree_key%-}"
if [ -z "$worktree_key" ]; then
    worktree_key="worktree"
fi
printf 'PRISM_DATABASE_COMPOSE_PROJECT=prism-codex-%s\n' "$worktree_key" > .env

(
    cd backend
    go mod download
)

(
    cd frontend
    pnpm_spec="$(node -p 'require("./package.json").packageManager')"
    npm exec --yes --package="$pnpm_spec" -- pnpm install --frozen-lockfile
)
'''

[[actions]]
name = "Run full"
icon = "run"
command = "./start.sh full"

[[actions]]
name = "Run headless"
icon = "run"
command = "./start.sh headless"

[[actions]]
name = "Backend checks"
icon = "run"
command = '''
set -eu
cd backend
go test ./internal/... ./cmd/...
go test ./tests/contract ./tests/integration ./tests/runtime ./tests/priority/...
'''

[[actions]]
name = "Frontend checks"
icon = "run"
command = '''
set -eu
cd frontend
pnpm_spec="$(node -p 'require("./package.json").packageManager')"
npm exec --yes --package="$pnpm_spec" -- pnpm exec vitest run
npm exec --yes --package="$pnpm_spec" -- pnpm run test:lib
npm exec --yes --package="$pnpm_spec" -- pnpm run build
npm exec --yes --package="$pnpm_spec" -- pnpm run lint
'''
